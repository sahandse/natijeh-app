name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --install "platforms;android-36.1" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --tests com.natijeh.data.mapper.SportsMapperTest --tests com.natijeh.ExampleUnitTest --tests com.natijeh.data.util.JalaliDateTest --tests com.natijeh.data.util.MatchAlertFormatterTest

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Name APK
        id: apk
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/natijeh-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=dist/natijeh-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: natijeh-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: نتیجه ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          make_latest: true
          body: |
            نسخه ${{ steps.apk.outputs.version }} اپ نتیجه (لایواسکور فارسی).

            فایل APK را از بخش Assets همین Release دانلود کنید.
            برای نصب روی گوشی، منبع ناشناخته را موقتاً فعال کنید.
